[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "rocky"
version = "1.0.0"
description = "Manually authored Rocky dialogue, Gemma 4 training, and scene-aware conversation"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
train = ["torch==2.14.0", "transformers==5.12.0", "datasets==4.8.1", "accelerate==1.15.0", "peft==0.20.0"]
tracking = ["wandb==0.30.0"]
dev = ["pytest>=8.3", "ruff>=0.12"]

[project.scripts]
rocky = "rocky.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
