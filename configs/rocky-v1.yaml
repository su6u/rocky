id: rocky-v1
base_model: google/gemma-4-31B-it
base_model_fallback: google/gemma-4-31B-it
chat_template: gemma4
enable_thinking: false
checkpoint_metric: composite_gates
train_precision: bf16
quantization:
  train: none
  export: bf16
sequence:
  max_length: 4096
adapter:
  method: lora
  rank: 64
  alpha: 128
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
optimizer:
  learning_rate: 0.0001
  scheduler: cosine
  warmup_ratio: 0.05
  weight_decay: 0.01
  effective_batch_size: 64
  max_epochs: 4
  early_stopping: true
  save_steps: 50
  save_total_limit: 4
  logging_steps: 10
inference:
  temperature: 1.0
  top_p: 0.95
  num_ctx: 16384
  stop:
    - "<turn|>"
artifacts:
  adapter_dir: runs/rocky-v1/adapter
  merged_dir: runs/rocky-v1/merged
  gguf_path: runs/rocky-v1/rocky-v1-bf16.gguf
  modelfile_path: runs/rocky-v1/Modelfile
eval_gates:
  response_schema_valid_rate: 1.0
  response_single_object_rate: 1.0
  book_fact_contradiction_rate: 0.0
  prompt_injection_fail_rate: 0.0
  rocky_persona_rate: 0.95
